# mihomo (Clash Meta) config for the VPS exit node.
# Edit only two things: `secret` and the `proxies` list (and the group below).

mode: rule
log-level: info
ipv6: false                 # no IPv6 out through the proxy -> no v6 leaks
allow-lan: false
mixed-port: 7890            # localhost-only test port; proxyctl uses it to show the exit IP
geo-auto-update: false

profile:
  store-selected: true      # remember the proxy you picked across restarts

# --- Web UI / API (setup.sh firewalls port 9090 to tailscale0 only) ---------
external-controller: 0.0.0.0:9090
secret: "CHANGE-ME"         # put a long random string here
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# --- TUN: traffic from Tailscale clients is routed here by setup.sh ---------
tun:
  enable: true
  stack: system
  device: tun0
  auto-route: false         # we route only `iif tailscale0` here, not the VPS itself
  auto-detect-interface: false

# Read hostnames from TLS/HTTP so the proxy gets domains, not bare IPs.
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]
      override-destination: true

# --- DNS: the VPS resolver points here; upstream DoH goes through the proxy -
dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 1.1.1.1
  nameserver:
    - "https://1.1.1.1/dns-query#PROXY"
    - "https://8.8.8.8/dns-query#PROXY"

# --- Your ISP SOCKS5 proxies (use IPs, simple names without spaces) ---------
proxies:
  - name: isp-1
    type: socks5
    server: 203.0.113.10
    port: 1080
    username: user
    password: pass
    udp: true               # harmless if the provider has no UDP; UDP just fails

  - name: isp-2
    type: socks5
    server: 203.0.113.20
    port: 1080
    username: user
    password: pass
    udp: true

# Manual selector you switch in the UI / proxyctl.
# DIRECT is deliberately NOT listed, so nothing can leave via the VPS's own IP.
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - isp-1
      - isp-2

rules:
  - MATCH,PROXY
